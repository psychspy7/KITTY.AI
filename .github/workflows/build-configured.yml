name: Build configured KITTY APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configured-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run check --prefix functions && npm test --prefix functions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Firebase public Android configuration
        env:
          KITTY_FIREBASE_ANDROID_CONFIG: ${{ vars.KITTY_FIREBASE_ANDROID_CONFIG }}
          KITTY_FIREBASE_REGION: ${{ vars.KITTY_FIREBASE_REGION }}
        run: |
          python - <<'PYCFG'
          import json, os
          from pathlib import Path
          raw = os.environ.get('KITTY_FIREBASE_ANDROID_CONFIG', '')
          if not raw: raise SystemExit('Add KITTY_FIREBASE_ANDROID_CONFIG repository variable first')
          cfg = json.loads(raw)
          if 'private_key' in cfg or 'project_info' not in cfg: raise SystemExit('Use google-services.json, never a service-account private key')
          Path('android/app/google-services.json').write_text(json.dumps(cfg))
          PYCFG
      - name: Restore signing key
        env:
          KITTY_KEYSTORE_B64: ${{ secrets.KITTY_KEYSTORE_B64 }}
        run: |
          test -n "$KITTY_KEYSTORE_B64" || { echo "Add KITTY_KEYSTORE_B64 in repository secrets first"; exit 1; }
          echo "$KITTY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kitty-release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          KITTY_KEYSTORE_PATH: ${{ runner.temp }}/kitty-release.jks
          KITTY_STORE_PASSWORD: ${{ secrets.KITTY_STORE_PASSWORD }}
          KITTY_KEY_ALIAS: ${{ secrets.KITTY_KEY_ALIAS }}
          KITTY_KEY_PASSWORD: ${{ secrets.KITTY_KEY_PASSWORD }}
          KITTY_FIREBASE_REGION: ${{ vars.KITTY_FIREBASE_REGION }}
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleRelease
      - name: Audit release APK permissions
        run: python tools/check_apk_permissions.py --apk android/app/build/outputs/apk/release/app-release.apk --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" --merged-manifest android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
      - name: Save private test build (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: KITTY-configured-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
