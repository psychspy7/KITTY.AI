name: Verify KITTY
on:
  push:
    paths:
      - 'android/**'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore*'
      - 'docs/START_HERE_V06.md'
      - 'tools/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore*'
      - 'docs/START_HERE_V06.md'
      - 'tools/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions
      - run: npm run check --prefix functions && npm test --prefix functions
      - name: Validate Firebase function definition
        run: node -e "require('./functions/src/index.js')"
      - name: Firestore rules and real emulator transactions
        run: npx --yes firebase-tools@15 emulators:exec --project demo-kitty-ci --only firestore,auth "node --test functions/test/emulator.integration.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KITTY-Firebase-reports
          path: |
            firebase-debug.log
            firestore-debug.log
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Audit merged and packaged permissions
        run: |
          python tools/check_apk_permissions.py --apk android/app/build/outputs/apk/debug/app-debug.apk --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" --merged-manifest android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml > android/app/build/reports/permissions.txt
          cat android/app/build/reports/permissions.txt
      - name: Record APK identity for Firebase setup
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/reports/apk-certificate.txt
          cat android/app/build/reports/apk-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KITTY-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KITTY-AI-unsigned-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KITTY-UI-test-apk
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KITTY-Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/apk-certificate.txt
            android/app/build/reports/permissions.txt
  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: KITTY-AI-debug-apk
          path: android/app/build/outputs/apk/debug
      - uses: actions/download-artifact@v4
        with:
          name: KITTY-UI-test-apk
          path: android/app/build/outputs/apk/androidTest/debug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cloud onboarding, permission and native layout checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          script: python tools/emulator_smoke.py --serial emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KITTY-emulator-evidence
          path: android/app/build/reports/emulator/
