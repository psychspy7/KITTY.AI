name: Verify KITTY
on:
  push:
    paths:
      - 'android/**'
      - 'server/**'
      - 'tests/**'
      - '*.bat'
      - 'requirements-turso.txt'
      - 'requirements-cloud.txt'
      - 'docs/START_HERE_V03.md'
      - 'tools/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'server/**'
      - 'tests/**'
      - '*.bat'
      - 'requirements-turso.txt'
      - 'requirements-cloud.txt'
      - 'docs/START_HERE_V03.md'
      - 'tools/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-turso.txt -r requirements-cloud.txt
      - run: python -m unittest discover -s tests -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: KITTY-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KITTY-AI-unsigned-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KITTY-Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: KITTY-AI-debug-apk
          path: android/app/build/outputs/apk/debug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Phone and gateway smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          script: python tools/emulator_smoke.py --serial emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KITTY-emulator-evidence
          path: android/app/build/reports/emulator/
