name: Real model smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/model-smoke.yml'
      - 'tools/model_ci_smoke.py'
permissions:
  contents: read
concurrency:
  group: model-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qwen-gguf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned official llama.cpp CPU runtime
        run: |
          curl --fail --location --retry 3 --output /tmp/kitty-llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b11146/llama-b11146-bin-ubuntu-x64.tar.gz
          echo 'c150306eb16b5ab696f76a8bdf810c35fd98a24e82158742e6fa28f420ff8410  /tmp/kitty-llama.tar.gz' | sha256sum --check
          mkdir -p runtime
          tar -xzf /tmp/kitty-llama.tar.gz -C runtime
      - name: Download and verify the requested Q4_K_M GGUF
        run: python tools/download_model.py
      - name: Exercise real generation through the KITTY brain
        run: python tools/model_ci_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KITTY-real-model-evidence
          path: build/model-smoke/
