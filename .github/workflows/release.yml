name: Build signed KITTY release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v0.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate exact version tag and source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          test "v$VERSION_NAME" = "$RELEASE_TAG"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-turso.txt -r requirements-cloud.txt
      - run: python -m unittest discover -s tests -q
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Firebase public Android configuration
        env:
          KITTY_FIREBASE_ANDROID_CONFIG: ${{ vars.KITTY_FIREBASE_ANDROID_CONFIG }}
          KITTY_SERVER_URL: ${{ vars.KITTY_SERVER_URL }}
        run: |
          python - <<'PYCFG'
          import json, os
          from pathlib import Path
          if not os.environ.get('KITTY_SERVER_URL', '').startswith('https://'):
              raise SystemExit('Add KITTY_SERVER_URL repository variable first')
          raw = os.environ.get('KITTY_FIREBASE_ANDROID_CONFIG', '')
          if not raw: raise SystemExit('Add KITTY_FIREBASE_ANDROID_CONFIG repository variable first')
          cfg = json.loads(raw)
          if 'private_key' in cfg or 'project_info' not in cfg: raise SystemExit('Use google-services.json, never a service-account private key')
          Path('android/app/google-services.json').write_text(json.dumps(cfg))
          PYCFG
      - name: Restore signing key
        env:
          KITTY_KEYSTORE_B64: ${{ secrets.KITTY_KEYSTORE_B64 }}
        run: |
          test -n "$KITTY_KEYSTORE_B64" || { echo "Add KITTY_KEYSTORE_B64 in repository secrets first"; exit 1; }
          echo "$KITTY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kitty-release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          KITTY_KEYSTORE_PATH: ${{ runner.temp }}/kitty-release.jks
          KITTY_STORE_PASSWORD: ${{ secrets.KITTY_STORE_PASSWORD }}
          KITTY_KEY_ALIAS: ${{ secrets.KITTY_KEY_ALIAS }}
          KITTY_KEY_PASSWORD: ${{ secrets.KITTY_KEY_PASSWORD }}
          KITTY_SERVER_URL: ${{ vars.KITTY_SERVER_URL }}
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleRelease
      - name: Audit release APK permissions
        run: python tools/check_apk_permissions.py --apk android/app/build/outputs/apk/release/app-release.apk --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" --merged-manifest android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
      - name: Prepare release metadata
        id: metadata
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/KITTY-AI-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release-assets/KITTY-AI-release.apk
          sha256sum release-assets/KITTY-AI-release.apk | cut -d' ' -f1 > release-assets/sha256.txt
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9]*\).*/\1/p" android/app/build.gradle)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat release-assets/sha256.txt)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" release-assets/KITTY-AI-release.apk release-assets/sha256.txt \
            --title "KITTY AI ${VERSION_NAME}" \
            --generate-notes
      - name: Update public update manifest
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          SHA256: ${{ steps.metadata.outputs.sha256 }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path("release/update.json")
          current=json.loads(path.read_text())
          if current["latest_version_code"] >= int(os.environ["VERSION_CODE"]):
              raise SystemExit("Release code must increase above the current public manifest")
          data = {
              "latest_version_code": int(os.environ["VERSION_CODE"]),
              "version_name": os.environ["VERSION_NAME"],
              "download_url": "https://github.com/psychspy7/KITTY.AI/releases/download/"+os.environ["RELEASE_TAG"]+"/KITTY-AI-release.apk",
              "sha256": os.environ["SHA256"],
              "release_notes": "See the GitHub release notes for this build.",
              "min_supported_version_code": 20,
          }
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/update.json
          git commit -m "chore: publish update manifest ${VERSION_NAME}"
          git push origin HEAD:main
