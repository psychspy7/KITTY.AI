plugins { id 'com.android.application' }
android {
    namespace 'com.kitty.ai'
    compileSdk 35
    def releaseKeystorePath = System.getenv('KITTY_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('KITTY_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('KITTY_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('KITTY_KEY_PASSWORD')
    defaultConfig {
        applicationId 'com.kitty.ai'
        minSdk 29
        targetSdk 35
        versionCode 30
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildFeatures { aidl true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath) signingConfig signingConfigs.release
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    lint { abortOnError true }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
