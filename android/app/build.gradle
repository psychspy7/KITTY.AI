plugins { id 'com.android.application' }
// google-services.json is public Firebase app configuration, never a service-account key.
def firebaseFile = file('google-services.json')
def firebase = firebaseFile.exists() ? new groovy.json.JsonSlurper().parse(firebaseFile) : [:]
def androidClient = (firebase.client ?: []).find { it.client_info?.android_client_info?.package_name == 'com.kitty.ai' } ?: [:]
def firebaseFields = [
    FIREBASE_PROJECT_ID: firebase.project_info?.project_id ?: '',
    FIREBASE_APP_ID: androidClient.client_info?.mobilesdk_app_id ?: '',
    FIREBASE_API_KEY: (androidClient.api_key ?: []).find { it.current_key }?.current_key ?: '',
    GOOGLE_WEB_CLIENT_ID: (androidClient.oauth_client ?: []).find { it.client_type == 3 }?.client_id ?: ''
]
if (firebaseFile.exists() && firebaseFields.values().any { !it }) throw new GradleException('Firebase Android config is incomplete. Enable Google Auth and download google-services.json again.')
android {
    namespace 'com.kitty.ai'
    compileSdk 36
    def releaseKeystorePath = System.getenv('KITTY_KEYSTORE_PATH')
    def releaseStorePassword = System.getenv('KITTY_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('KITTY_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('KITTY_KEY_PASSWORD')
    defaultConfig {
        applicationId 'com.kitty.ai'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 29
        targetSdk 35
        versionCode 60
        versionName '0.6.0'
        def region = System.getenv('KITTY_FIREBASE_REGION') ?: 'asia-south1'
        if (!(region ==~ /[a-z]+-[a-z]+[0-9]+/)) throw new GradleException('Invalid Firebase region')
        def project = firebaseFields.FIREBASE_PROJECT_ID
        if (project && !(project ==~ /[a-z][a-z0-9-]{4,28}[a-z0-9]/)) throw new GradleException('Invalid Firebase project ID')
        def apiUrl = project ? "https://${region}-${project}.cloudfunctions.net/kittyApi" : ''
        buildConfigField 'String', 'KITTY_API_URL', groovy.json.JsonOutput.toJson(apiUrl)
        firebaseFields.each { key, value -> buildConfigField 'String', key, groovy.json.JsonOutput.toJson(value) }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
